name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Terminal Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: lZXGl
          template: terminal
          base: header, metadata, repositories
          config_timezone: UTC
          filename: metrics.terminal.svg
          plugin_lines: yes
          plugin_lines_history_limit: 2
          plugin_lines_repositories_limit: 6

      - name: Topics Icons
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: lZXGl
          base: ""
          filename: metrics.plugin.topics.icons.svg
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 20
